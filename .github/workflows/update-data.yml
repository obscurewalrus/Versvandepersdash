name: Ververs dashboard-data

on:
  schedule:
    # Eén keer per uur. Bewust niet vaker: bij hosting op Cloudflare Pages
    # telt elke data-commit als een build, en de gratis laag geeft 500
    # builds/maand. Uurlijks (~720 runs, lang niet allemaal met nieuwe data)
    # blijft daar netjes onder. Host je op GitHub Pages zonder Cloudflare?
    # Dan mag dit gerust terug naar "*/20 * * * *" voor versere cijfers.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Nieuwe publicaties ophalen uit Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python scripts/fetch_slack.py

      - name: Wijzigingen committen
        run: |
          if git diff --quiet data/publicaties.json; then
            echo "Geen nieuwe publicaties."
            exit 0
          fi
          git config user.name "versvandepers-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/publicaties.json
          git commit -m "Publicatiedata bijgewerkt"
          git push
